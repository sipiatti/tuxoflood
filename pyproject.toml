[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tuxoflood"
version = "0.1.0"
description = "Vidám pingvines színkitöltő fejtörő (Flood-It-stílus) – a cheerful penguin colour-flood puzzle"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Siposs Attila", email = "sipiatti@gmail.com" }]
maintainers = [{ name = "Siposs Attila", email = "sipiatti@gmail.com" }]
keywords = ["game", "puzzle", "flood-it", "flood fill", "colour", "penguin", "linux", "pygame"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Natural Language :: Hungarian",
    "Natural Language :: English",
]
# pygame 2.x (Debian/Ubuntu: python3-pygame) – pygame-ce works as well
dependencies = ["pygame>=2.1"]

[project.optional-dependencies]
dev = ["pytest", "cairosvg", "numpy"]

[project.scripts]
tuxoflood = "tuxoflood.app:main"

[tool.setuptools]
packages = ["tuxoflood"]

[tool.setuptools.package-data]
tuxoflood = ["assets/fonts/*", "assets/icons/*.png", "assets/penguins/*.png", "assets/svg/*.svg",
             "assets/sounds/*.wav", "assets/music/*.ogg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:no fast renderer available"]
